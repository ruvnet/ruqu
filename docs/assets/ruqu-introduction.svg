<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">ruqu: quantum research in Rust</title><desc id="desc">Circuit simulation, magic state estimation and bounded quantum error correction research. Rotating orbit lines connect a schematic logical qubit to three research capabilities.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071122"/><stop offset="1" stop-color="#101c37"/></linearGradient><linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca4ce" stroke-opacity=".055"/></pattern></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e5edf8}.mono{font-family:Consolas,monospace}.muted{fill:#98abc5}.cyan{fill:#22d3ee}.violet{fill:#a78bfa}.amber{fill:#fbbf24}.line{stroke:#34506c;stroke-width:1.5;fill:none}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:7 12;animation:flow 9s linear infinite}.orbit{transform-origin:790px 214px;animation:spin 36s linear infinite}.float{animation:float 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-190}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.orbit,.float{animation:none!important}}</style><rect width="1120" height="470" rx="24" fill="url(#bg)"/><rect width="1120" height="470" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1118" height="468" rx="23" fill="none" stroke="#31445f"/>
<path d="M40 42H1080" stroke="url(#edge)" stroke-width="3"/>
