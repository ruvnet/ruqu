<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">Magic state factory: a reproducible walkthrough</title><desc id="desc">Four stages show fifteen noisy inputs, parity checks with rejected patterns, accepted output and resource accounting. The model uses ideal distillation operations and independent input errors.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071122"/><stop offset="1" stop-color="#101c37"/></linearGradient><linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca4ce" stroke-opacity=".055"/></pattern></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e5edf8}.mono{font-family:Consolas,monospace}.muted{fill:#98abc5}.cyan{fill:#22d3ee}.violet{fill:#a78bfa}.amber{fill:#fbbf24}.line{stroke:#34506c;stroke-width:1.5;fill:none}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:7 12;animation:flow 9s linear infinite}.orbit{transform-origin:790px 214px;animation:spin 36s linear infinite}.float{animation:float 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-190}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.orbit,.float{animation:none!important}}</style><rect width="1120" height="450" rx="24" fill="url(#bg)"/><rect width="1120" height="450" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1118" height="448" rx="23" fill="none" stroke="#31445f"/>
<text x="44" y="55" class="cyan" font-size="12" letter-spacing="3">WALKTHROUGH / IDEAL 15-TO-1 MODEL</text><text x="44" y="96" font-size="30" font-weight="650">Every useful state has a yield cost.</text><text x="44" y="126" class="muted" font-size="15">Trace the exact reference model from assumptions to accepted output.</text>
<path d="M243 244H299M505 244H561M767 244H823" stroke="url(#edge)" stroke-width="3" class="flow"/>
<g><rect x="44" y="168" width="199" height="169" rx="16" fill="#10283b" stroke="#22718a"/><text x="62" y="196" class="cyan" font-size="12">01 / INPUT</text><text x="62" y="228" font-size="19" font-weight="600">15 noisy states</text><text x="62" y="253" class="muted" font-size="13">Independent error p</text><circle cx="70" cy="282" r="5" fill="#22d3ee"/><circle cx="93" cy="282" r="5" fill="#22d3ee"/><circle cx="116" cy="282" r="5" fill="#22d3ee"/><circle cx="139" cy="282" r="5" fill="#22d3ee"/><circle cx="162" cy="282" r="5" fill="#22d3ee"/><circle cx="185" cy="282" r="5" fill="#22d3ee"/><circle cx="208" cy="282" r="5" fill="#22d3ee"/><circle cx="70" cy="303" r="5" fill="#22d3ee"/><circle cx="93" cy="303" r="5" fill="#fbbf24"/><circle cx="116" cy="303" r="5" fill="#22d3ee"/><circle cx="139" cy="303" r="5" fill="#22d3ee"/><circle cx="162" cy="303" r="5" fill="#22d3ee"/><circle cx="185" cy="303" r="5" fill="#22d3ee"/><circle cx="208" cy="303" r="5" fill="#22d3ee"/><circle cx="70" cy="324" r="5" fill="#22d3ee"/></g>
<g><rect x="299" y="168" width="206" height="169" rx="16" fill="#1b203d" stroke="#685395"/><text x="317" y="196" class="violet" font-size="12">02 / CHECK</text><text x="317" y="228" font-size="19" font-weight="600">32,768 patterns</text><text x="317" y="253" class="muted" font-size="13">Enumerate parity checks</text><path d="M320 278H484M320 290H451M320 302H471" stroke="#a78bfa" stroke-width="4" stroke-opacity=".6"/><text x="317" y="324" class="amber" font-size="11">Reject detected errors</text></g>
<g><rect x="561" y="168" width="206" height="169" rx="16" fill="#10283b" stroke="#22718a"/><text x="579" y="196" class="cyan" font-size="12">03 / ACCEPT</text><text x="579" y="228" font-size="19" font-weight="600">Conditional error</text><text x="579" y="253" class="muted" font-size="13">Accepted bad / accepted</text><circle cx="664" cy="295" r="22" fill="none" stroke="#22d3ee" stroke-width="2"/><circle cx="664" cy="295" r="8" class="pulse" fill="#22d3ee"/></g>
<g><rect x="823" y="168" width="253" height="169" rx="16" fill="#272719" stroke="#8d7335"/><text x="841" y="196" class="amber" font-size="12">04 / ACCOUNT</text><text x="841" y="228" font-size="19" font-weight="600">Resources / yield</text><text x="841" y="253" class="muted" font-size="13">Expected inputs = 15 / A</text><text x="841" y="281" class="muted" font-size="13">Include rejected attempts</text><text x="841" y="312" class="amber" font-size="14">Compare against exact results</text></g>
<rect x="44" y="367" width="1032" height="56" rx="12" fill="#071221" stroke="#2a405c"/><text x="64" y="391" class="mono" font-size="13">node cli/bin/cli.js magic-factory --input-error 0.01 --shots 100000 --seed 42</text><text x="64" y="412" class="muted" font-size="12">A = acceptance probability. Hardware execution faults and code transfer require additional models.</text>
</svg>