<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">ruqu architecture and scientific evidence contract</title><desc id="desc">Source CLI and native Rust examples feed circuit simulation, magic state accounting and bounded decoding. Assumptions and evidence flow through independent reference checks. No live QPU is connected.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071122"/><stop offset="1" stop-color="#101c37"/></linearGradient><linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ca4ce" stroke-opacity=".055"/></pattern></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e5edf8}.mono{font-family:Consolas,monospace}.muted{fill:#98abc5}.cyan{fill:#22d3ee}.violet{fill:#a78bfa}.amber{fill:#fbbf24}.line{stroke:#34506c;stroke-width:1.5;fill:none}.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:7 12;animation:flow 9s linear infinite}.orbit{transform-origin:790px 214px;animation:spin 36s linear infinite}.float{animation:float 7s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-190}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.orbit,.float{animation:none!important}}</style><rect width="1120" height="450" rx="24" fill="url(#bg)"/><rect width="1120" height="450" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1118" height="448" rx="23" fill="none" stroke="#31445f"/>
<text x="44" y="54" class="violet" font-size="12" letter-spacing="3">ARCHITECTURE / EVIDENCE FIRST</text><text x="44" y="94" font-size="30" font-weight="650">Small models. Explicit bounds. Reproducible evidence.</text>
<rect x="44" y="137" width="240" height="76" rx="12" fill="#10283b" stroke="#22718a"/><text x="64" y="167" class="cyan" font-size="17">Source CLI</text><text x="64" y="191" class="muted" font-size="13">Node.js + bundled WASM</text>
<rect x="44" y="243" width="240" height="76" rx="12" fill="#1b203d" stroke="#685395"/><text x="64" y="273" class="violet" font-size="17">Native Rust examples</text><text x="64" y="297" class="muted" font-size="13">Workspace modules + tests</text>
<path d="M284 175H322V227H360M284 281H322V227" class="line flow"/>
<rect x="360" y="137" width="355" height="182" rx="16" fill="#101e33" stroke="#45617e"/><text x="382" y="167" font-size="17">Bounded research models</text><path d="M382 184H692" class="line"/><text x="382" y="211" class="cyan" font-size="14">Circuit + sparse observable propagation</text><text x="382" y="245" class="violet" font-size="14">Exact distillation + seeded sampling</text><text x="382" y="279" class="amber" font-size="14">Hypergraph syndrome search</text><text x="382" y="302" class="muted" font-size="12">Memory, branch and search budgets apply</text>
<path d="M715 227H776" class="line flow"/><rect x="776" y="137" width="300" height="182" rx="16" fill="#10283b" stroke="#22718a"/><text x="798" y="167" font-size="17">Checkable outputs</text><text x="798" y="204" class="muted" font-size="14">Assumptions + model identity</text><text x="798" y="235" class="muted" font-size="14">Acceptance + rejected attempts</text><text x="798" y="266" class="muted" font-size="14">Reference agreement + seed</text><text x="798" y="297" class="muted" font-size="14">Resource estimates + limits</text>
<rect x="44" y="354" width="1032" height="70" rx="12" fill="#071221" stroke="#51482b"/><text x="64" y="382" class="amber" font-size="14">Validation gate</text><text x="64" y="406" class="muted" font-size="14">Exact small instances first. Larger hardware claims require protocol circuits, realistic noise and external validation.</text>
</svg>