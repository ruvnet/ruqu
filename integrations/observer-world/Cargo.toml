[package]
name = "ruqu-observer-world"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Verified synthetic observer records projected into real RuField and WorldGraph types"

# Deliberately independent of ruQu's hardware and accelerator build matrix.
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rufield-core = { git = "https://github.com/ruvnet/rufield.git", rev = "7179a2efc706993ee0d87f0093e6a0e9e3dc5017" }
rufield-privacy = { git = "https://github.com/ruvnet/rufield.git", rev = "7179a2efc706993ee0d87f0093e6a0e9e3dc5017" }
rufield-provenance = { git = "https://github.com/ruvnet/rufield.git", rev = "7179a2efc706993ee0d87f0093e6a0e9e3dc5017" }
wifi-densepose-worldgraph = { git = "https://github.com/ruvnet/worldgraph.git", rev = "9b1c79c836cdacfb7b44f058c593157bac4c1dab", default-features = false }
wifi-densepose-geo = { git = "https://github.com/ruvnet/worldgraph.git", rev = "9b1c79c836cdacfb7b44f058c593157bac4c1dab", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
